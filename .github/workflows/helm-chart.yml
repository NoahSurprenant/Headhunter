name: Helm chart

# The deployment chart (charts/headhunter), as GrifballWebApp's. Pull requests: lint, unit tests
# (helm-unittest), every ci/*-values.yaml rendered and checked against the Kubernetes schemas, and an
# end-to-end run on k3s (charts/headhunter/e2e/run.sh) on the homelab's Kubernetes minor and the oldest
# and newest supported.
# master: the same, then, if the chart changed, publish it to
# oci://ghcr.io/noahsurprenant/charts/headhunter as <Chart.yaml's major.minor>.<run number>, signed
# keyless with cosign.
on:
  pull_request:
    branches: [ "master" ]
    paths: [ "charts/**", ".github/workflows/helm-chart.yml", "Headhunter.API/Dockerfile", "Headhunter.Database/**" ]
  push:
    branches: [ "master" ]
    paths: [ "charts/**", ".github/workflows/helm-chart.yml", "Headhunter.API/Dockerfile", "Headhunter.Database/**" ]
  workflow_dispatch:

env:
  CHART: charts/headhunter
  REGISTRY: ghcr.io
  # Lowercase: OCI references are.
  CHART_REPO: oci://ghcr.io/noahsurprenant/charts
  # The Kubernetes versions supported (Chart.yaml kubeVersion): the oldest and the newest.
  KUBERNETES_OLDEST: "1.34.0"
  KUBERNETES_NEWEST: "1.37.0"

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Lint
        run: |
          set -euo pipefail
          for values in "$CHART"/ci/*-values.yaml; do
            echo "::group::helm lint -f $values"
            helm lint "$CHART" --strict -f "$values"
            echo "::endgroup::"
          done

      - name: Unit tests
        run: |
          set -euo pipefail
          # Helm 4 verifies plugin signatures by default; helm-unittest publishes none.
          if helm version --short | grep -q '^v3'; then verify=; else verify=--verify=false; fi
          helm plugin install https://github.com/helm-unittest/helm-unittest $verify
          helm unittest "$CHART"

      - name: Schema check
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          # Older than the oldest supported must be refused (Chart.yaml kubeVersion).
          if helm template ci "$CHART" -f "$CHART/ci/minimal-values.yaml" --kube-version 1.33.0 >/dev/null 2>&1; then
            echo "::error::The chart renders for Kubernetes 1.33, older than its kubeVersion allows"; exit 1
          fi
          for k8s in "$KUBERNETES_OLDEST" "$KUBERNETES_NEWEST"; do
          for values in "$CHART"/ci/*-values.yaml; do
            echo "::group::$values, Kubernetes $k8s"
            # Traefik's IngressRoute and the ServiceMonitor from the community CRD catalog.
            helm template ci "$CHART" -n headhunter-ci -f "$values" --kube-version "$k8s" \
              | ./kubeconform -strict -summary -kubernetes-version "$k8s" \
                  -schema-location default \
                  -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
            echo "::endgroup::"
          done
          done

  # The app image from this checkout: the chart's migration steps need what it carries (sqlcmd, the
  # bundle, its list), so a published one may not do.
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Headhunter.API/Dockerfile
          tags: headhunter:e2e
          outputs: type=docker,dest=${{ runner.temp }}/headhunter.tar
          cache-from: type=gha

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-image
          path: ${{ runner.temp }}/headhunter.tar
          retention-days: 1

  # The chart on a real cluster (k3s in Docker, which enforces NetworkPolicies): the homelab's
  # Kubernetes minor and the oldest and newest supported.
  e2e:
    needs: [test, image]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        k3s: [v1.36.5-k3s1, v1.34.12-k3s1, v1.37.1-k3s1]
    name: e2e (${{ matrix.k3s }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-image
          path: ${{ runner.temp }}

      - name: Cluster
        run: |
          set -euo pipefail
          curl -fsSL -o /usr/local/bin/k3d https://github.com/k3d-io/k3d/releases/download/v5.8.3/k3d-linux-amd64
          chmod +x /usr/local/bin/k3d
          k3d cluster create e2e --image "rancher/k3s:${{ matrix.k3s }}" --no-lb --k3s-arg '--disable=traefik@server:0' --wait --timeout 180s
          kubectl version
          docker load -i "${{ runner.temp }}/headhunter.tar"
          # k3d can say it imported an image when it didn't (GrifballWebApp's helm-chart.yml has the
          # details), so the node's own image list is checked and the import repeated.
          for attempt in 1 2 3; do
            k3d image import headhunter:e2e -c e2e || true
            if docker exec k3d-e2e-server-0 ctr -n k8s.io images ls -q | grep -qx docker.io/library/headhunter:e2e; then
              echo "The e2e image is in the cluster (import $attempt)."; break
            fi
            [ "$attempt" -lt 3 ] || { echo "::error::The e2e image isn't in the cluster after 3 imports"; exit 1; }
            echo "::warning::k3d's import $attempt left the e2e image out of the cluster; importing again"
            sleep 5
          done

      - name: End-to-end
        env:
          APP_IMAGE: headhunter:e2e
        run: ${{ env.CHART }}/e2e/run.sh

  # Publishes the chart when it changed: version <Chart.yaml's major.minor>.<this workflow's run
  # number>, so every change gets a new version without anyone bumping it; a major or minor bump is a
  # Chart.yaml edit. Then signs it keyless with cosign (Sigstore), as docker-publish.yml signs the
  # image, and checks the signature.
  publish:
    needs: [test, e2e]
    # Only from master: a run started by hand on another branch (workflow_dispatch) tests, never publishes.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Did the chart change?
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # A push that didn't touch the chart (only the Dockerfile, say) publishes nothing; a manual
          # run or an unknown base always does.
          if [ "${{ github.event_name }}" = push ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
             && git diff --quiet "$BEFORE" HEAD -- "$CHART"; then
            echo "The chart didn't change: nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        if: steps.changed.outputs.publish == 'true'

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.changed.outputs.publish == 'true'
        with:
          cosign-release: v3.1.4

      - name: Log into ${{ env.REGISTRY }}
        if: steps.changed.outputs.publish == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish and sign
        if: steps.changed.outputs.publish == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IDENTITY: ^https://github\.com/${{ github.repository }}/\.github/workflows/helm-chart\.yml@refs/heads/master$
        run: |
          set -euo pipefail
          echo "$TOKEN" | helm registry login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          base=$(sed -n 's/^version: *//p' "$CHART/Chart.yaml")
          version="${base%.*}.${{ github.run_number }}"
          # A re-run of this run would reuse its number: never overwrite a published version.
          if helm show chart "$CHART_REPO/headhunter" --version "$version" >/dev/null 2>&1; then
            echo "headhunter $version is already published; not overwriting it."
            exit 0
          fi
          helm package "$CHART" --version "$version" -d dist
          helm push "dist/headhunter-$version.tgz" "$CHART_REPO" 2>&1 | tee push.txt
          digest=$(sed -n 's/^Digest: *//p' push.txt)
          test -n "$digest"
          ref="${CHART_REPO#oci://}/headhunter@$digest"
          cosign sign --yes "$ref"
          cosign verify "$ref" --certificate-identity-regexp "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          {
            echo "Published and signed $CHART_REPO/headhunter:$version ($digest)."
            echo
            echo "Verify: cosign verify ${ref%@*}:$version --certificate-identity-regexp '$IDENTITY' --certificate-oidc-issuer https://token.actions.githubusercontent.com"
          } >> "$GITHUB_STEP_SUMMARY"
