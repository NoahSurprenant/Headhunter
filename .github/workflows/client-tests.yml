name: Client tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

concurrency:
  group: client-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Angular unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Headhunter.Client

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same Node version as the angular stage in Headhunter.API/Dockerfile.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: Headhunter.Client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests (Vitest, jsdom)
        run: npx ng test --watch=false --coverage

  # The layout test (e2e/layout.spec.ts): every page at 360 and 390 px wide must not scroll
  # sideways, with the nav and the paginator's controls on screen. On the production build, with the
  # API mocked (e2e/serve.mjs, e2e/mockApi.mts).
  layout:
    name: Layout on phones (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Headhunter.Client

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: Headhunter.Client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build and run the layout test
        run: npm run e2e

      # Each page at each width, for a look; even when the test failed, since they show why
      - name: Upload the screenshots
        if: ${{ !cancelled() && hashFiles('Headhunter.Client/screenshots/*.png') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: layout-screenshots
          path: Headhunter.Client/screenshots/*.png
          retention-days: 30

      - name: Upload the Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            Headhunter.Client/e2e-results/
            Headhunter.Client/playwright-report/
          retention-days: 7

  # Lighthouse on the production build with the mocked API, with the mobile and the desktop
  # settings (lighthouserc.cjs). Accessibility, best practices and SEO must score 90 on every page;
  # performance has a lower floor (Cesium, CI runners are noisy) and none where the globe shows, and warns
  # under 90.
  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Run with npx. Not LHCI_*: lhci reads those as options.
      LIGHTHOUSE_CI_VERSION: '0.15.1'
    defaults:
      run:
        working-directory: Headhunter.Client

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: Headhunter.Client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx ng build

      # The runner's Google Chrome. The reports go to Lighthouse's temporary public storage (kept
      # for a few days), linked from the scores.
      - name: Run Lighthouse
        run: |
          lhci="npx --yes @lhci/cli@${LIGHTHOUSE_CI_VERSION}"
          failed=0
          : > lighthouse.md
          for preset in mobile desktop; do
            LIGHTHOUSE_PRESET=$preset $lhci collect
            $lhci upload || echo "::warning::The $preset reports could not be uploaded"
            # The table to the file; the warnings (stderr) to the log, where GitHub picks them up
            { node e2e/lighthouse-summary.mjs "${preset^}" >> lighthouse.md; } 2>&1
            LIGHTHOUSE_PRESET=$preset $lhci assert || failed=1
            mv .lighthouseci "lighthouse-$preset"
          done
          { echo "### Lighthouse"; echo; cat lighthouse.md; } >> "$GITHUB_STEP_SUMMARY"
          exit $failed

      # The table, for the PR comment (the report job)
      - name: Upload the Lighthouse scores
        if: ${{ !cancelled() && hashFiles('Headhunter.Client/lighthouse.md') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-scores
          path: Headhunter.Client/lighthouse.md
          retention-days: 1

      - name: Upload the Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: Headhunter.Client/lighthouse-*/
          retention-days: 30

  # On a PR, one comment with the Lighthouse scores, which each run updates in place
  lighthouse-comment:
    name: Lighthouse comment
    needs: lighthouse
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write

    steps:
      - name: Download the Lighthouse scores
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: lighthouse-scores
          path: lighthouse

      - name: Comment on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          scores=""
          if [ -s lighthouse/lighthouse.md ]; then
            scores="$(cat lighthouse/lighthouse.md)"
          fi
          marker='<!-- lighthouse-scores -->'
          body="$marker
          ### Lighthouse

          The production build with a mocked API, as of $SHA ([run]($RUN)). Each page links to its full report (kept for a few days).

          ${scores:-_No scores: see the Lighthouse job._}"
          # A fork's PR gets a read-only token
          if [ "$HEAD_REPO" != "$REPO" ]; then
            echo "$body" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq "[.[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\")))][0].id // empty" | head -n1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -f body="$body" > /dev/null
          else
            gh pr comment "$PR" -R "$REPO" --body "$body"
          fi
