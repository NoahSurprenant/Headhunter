name: Client tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

concurrency:
  group: client-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Angular unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Headhunter.Client

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same Node version as the angular stage in Headhunter.API/Dockerfile.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: Headhunter.Client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests (Vitest, jsdom)
        run: npx ng test --watch=false --coverage
