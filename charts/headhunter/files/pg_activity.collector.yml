# What is running right now: blocked requests, the longest wait and request, head blockers and sessions by
# application. Point-in-time values, read on every scrape: a blocking chain that lasts 20 seconds is gone by the
# next minute. The counterpart of the SQL Server example's mssql_activity.
# Needs pg_monitor (pg_blocking_pids and every session's query). The exporter's own session is left out.
collector_name: pg_activity

metrics:
- metric_name: pg_blocked_requests
  type: gauge
  help: 'Client sessions waiting for a lock another session holds.'
  values: [count]
  query: |
    SELECT count(*)::float8 AS count FROM pg_stat_activity
    WHERE backend_type = 'client backend' AND cardinality(pg_blocking_pids(pid)) > 0

- metric_name: pg_blocked_wait_seconds_max
  type: gauge
  help: 'The longest a blocked session has been running its current query (0 with none blocked).'
  values: [seconds]
  query: |
    SELECT coalesce(max(extract(epoch FROM clock_timestamp() - query_start)), 0)::float8 AS seconds
    FROM pg_stat_activity
    WHERE backend_type = 'client backend' AND cardinality(pg_blocking_pids(pid)) > 0

- metric_name: pg_head_blockers
  type: gauge
  help: 'Sessions that block others and are not blocked themselves: the ones to look at first.'
  values: [count]
  query: |
    SELECT count(DISTINCT b)::float8 AS count
    FROM pg_stat_activity a, unnest(pg_blocking_pids(a.pid)) AS b
    WHERE cardinality(pg_blocking_pids(b)) = 0

- metric_name: pg_longest_request_seconds
  type: gauge
  help: 'How long the longest-running active query has been running (0 with none).'
  values: [seconds]
  query: |
    SELECT coalesce(max(extract(epoch FROM clock_timestamp() - query_start)), 0)::float8 AS seconds
    FROM pg_stat_activity
    WHERE state = 'active' AND backend_type = 'client backend' AND pid <> pg_backend_pid()

- metric_name: pg_idle_in_transaction_seconds_max
  type: gauge
  help: 'The longest a session has sat idle inside an open transaction (0 with none): it holds locks and back vacuum.'
  values: [seconds]
  query: |
    SELECT coalesce(max(extract(epoch FROM clock_timestamp() - state_change)), 0)::float8 AS seconds
    FROM pg_stat_activity
    WHERE state IN ('idle in transaction', 'idle in transaction (aborted)') AND backend_type = 'client backend'

- metric_name: pg_sessions_by_application
  type: gauge
  help: 'Client sessions by database and application_name (empty when the client sets none).'
  key_labels: [database, application]
  values: [count]
  query: |
    SELECT coalesce(datname, '') AS database, application_name AS application, count(*)::float8 AS count
    FROM pg_stat_activity
    WHERE backend_type = 'client backend' AND pid <> pg_backend_pid()
    GROUP BY 1, 2
