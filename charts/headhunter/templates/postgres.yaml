{{- $p := .Values.postgres -}}
{{- if $p.enabled }}
{{- $d := $p.persistence }}
{{- if not $d.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $d.claimName }}
  labels:
    {{- include "headhunter.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    # The database: never pruned by Argo CD, never deleted by helm uninstall.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    helm.sh/resource-policy: keep
    {{- with $d.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  accessModes:
    {{- toYaml $d.accessModes | nindent 4 }}
  {{- with $d.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ $d.size }}
---
{{- end }}
{{- $b := $p.backup }}
{{- if and $b.enabled (not $b.existingClaim) }}
{{- $pvName := $b.nfs.pvName | default (printf "%s-postgres-backup" .Release.Namespace) }}
{{- if $b.nfs.server }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ $pvName }}
  labels:
    {{- include "headhunter.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    helm.sh/resource-policy: keep
spec:
  capacity:
    storage: {{ $b.size }}
  accessModes:
    {{- toYaml $b.accessModes | nindent 4 }}
  storageClassName: ""
  persistentVolumeReclaimPolicy: {{ $b.nfs.reclaimPolicy }}
  nfs:
    server: {{ $b.nfs.server }}
    path: {{ required "postgres.backup.nfs.path is required with postgres.backup.nfs.server" $b.nfs.path }}
---
{{- end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $b.claimName }}
  labels:
    {{- include "headhunter.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    helm.sh/resource-policy: keep
    {{- with $b.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  accessModes:
    {{- toYaml $b.accessModes | nindent 4 }}
  {{- if $b.nfs.server }}
  storageClassName: ""
  volumeName: {{ $pvName }}
  {{- else if $b.storageClass }}
  storageClassName: {{ $b.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ $b.size }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $p.service.name }}
  labels:
    {{- include "headhunter.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  type: ClusterIP
  selector:
    app: {{ $p.name }}
  ports:
    - name: postgres
      port: {{ $p.service.port }}
      targetPort: postgres
---
{{- with $p.loadBalancer }}
{{- if .enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
  labels:
    {{- include "headhunter.labels" $ | nindent 4 }}
    app.kubernetes.io/component: postgres
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    {{- with .annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: LoadBalancer
  externalTrafficPolicy: {{ .externalTrafficPolicy }}
  selector:
    app: {{ $p.name }}
  ports:
    - name: postgres
      port: {{ .port }}
      targetPort: postgres
---
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $p.name }}
  labels:
    {{- include "headhunter.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
    {{- with include "headhunter.onDemandLabels" . | trim }}{{ . | nindent 4 }}{{ end }}
  annotations:
    # Before the migration Job (-1) and the app.
    argocd.argoproj.io/sync-wave: "-2"
spec:
  {{- with include "headhunter.replicas" (dict "root" . "replicas" 1) }}
  {{ . }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ $p.name }}
  # Stop the old PostgreSQL before starting the new one: a ReadWriteOnce volume allows every pod on the
  # same node, and two servers must never share one data folder.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: {{ $p.name }}
        {{- include "headhunter.podLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
        {{- with $p.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $p.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $p.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # PostgreSQL runs as 999 (the image's postgres user) and creates its data folder
        # (<major>/docker) in the volume, whose root kubelet may leave root-owned. PostgreSQL's own
        # image, as root: nothing else to pull.
        - name: fix-permissions-data
          image: {{ include "headhunter.image" $p.image }}
          imagePullPolicy: {{ $p.image.pullPolicy }}
          command: ["sh", "-c", "chown -R 999:999 /var/lib/postgresql"]
          securityContext:
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql
      containers:
        - name: postgres
          image: {{ include "headhunter.image" $p.image }}
          imagePullPolicy: {{ $p.image.pullPolicy }}
          {{- with $p.configuration }}
          args:
            {{- range $name, $value := . }}
            - -c
            - {{ printf "%s=%v" $name $value | quote }}
            {{- end }}
          {{- end }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: {{ include "headhunter.dbUser" . | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- include "headhunter.dbPasswordRef" . | nindent 18 }}
            # The app's database exists from the first start; the migrations fill it.
            - name: POSTGRES_DB
              value: {{ .Values.database.name | quote }}
            {{- with $p.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d postgres"]
            periodSeconds: 10
            timeoutSeconds: 5
          {{- with $p.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $p.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql
            # Read-only root filesystem: the socket and its lock go here.
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: {{ $d.existingClaim | default $d.claimName }}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      {{- with $p.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $p.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $p.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
