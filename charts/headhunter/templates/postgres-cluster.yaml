{{- $p := .Values.postgres -}}
{{- $c := $p.cloudnative -}}
{{- if and $p.enabled $c.enabled }}
{{- if not (include "headhunter.postgres" .) }}{{ fail "postgres.cloudnative needs database.provider Postgres" }}{{ end }}
# PostgreSQL by the CloudNativePG operator (postgres.cloudnative): a primary and streaming replicas on separate
# nodes, each with its own volume. The Service postgres (and the LoadBalancer) follow the primary, so the app, the
# migration Job, the backups and the exporter connect as before. The administrator's password is the one the
# operator generates (the Secret <cluster>-superuser), which the chart's pods read.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "headhunter.pgClusterName" . }}
  labels:
    {{- include "headhunter.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  annotations:
    # Before the migration Job (-1) and the app.
    argocd.argoproj.io/sync-wave: "-2"
    # The database: never pruned by Argo CD, never deleted by helm uninstall.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    helm.sh/resource-policy: keep
spec:
  instances: {{ $c.instances }}
  imageName: {{ include "headhunter.image" $c.image }}
  imagePullPolicy: {{ $c.image.pullPolicy }}
  enableSuperuserAccess: true
  # The pods carry app: <postgres.name>, as the Deployment's did: the NetworkPolicies and backups select on it.
  inheritedMetadata:
    labels:
      app: {{ $p.name }}
      {{- include "headhunter.podLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
      {{- with $p.podLabels }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
    {{- with $p.podAnnotations }}
    annotations:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  bootstrap:
    initdb:
      # The app's database exists from the first start; the migrations fill it.
      database: {{ .Values.database.name }}
      owner: {{ include "headhunter.dbUser" . }}
  storage:
    size: {{ $p.persistence.size }}
    {{- with $p.persistence.storageClass }}
    storageClassName: {{ . }}
    {{- end }}
  {{- if or $p.configuration $c.synchronous }}
  postgresql:
    {{- with $p.configuration }}
    parameters:
      {{- range $name, $value := . }}
      {{ $name }}: {{ $value | toString | quote }}
      {{- end }}
    {{- end }}
    {{- with $c.synchronous }}
    synchronous:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
  {{- with $p.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  affinity:
    # Each instance on a node of its own: a node lost takes one copy, not both.
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
    {{- with $p.nodeSelector }}
    nodeSelector:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with $p.tolerations }}
    tolerations:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- with $c.extraSpec }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
---
{{- if $c.podMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "headhunter.pgClusterName" . }}
  labels:
    {{- include "headhunter.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
    {{- with $c.podMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: {{ include "headhunter.pgClusterName" . }}
  podMetricsEndpoints:
    - port: metrics
{{- end }}
{{- end }}
