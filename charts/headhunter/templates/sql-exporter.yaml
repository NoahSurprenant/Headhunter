{{- $x := .Values.sqlExporter -}}
{{- if $x.enabled }}
{{- /* Its login: sqlExporter.user and password, else the administrator's. */}}
{{- $admin := include "headhunter.dbPasswordRef" . | fromYaml }}
{{- $user := $x.user | default .Values.database.user }}
{{- $passwordSecret := $admin.name }}
{{- $passwordKey := $admin.key }}
{{- if $x.password.key }}
{{- $passwordSecret = include "headhunter.secretName" (dict "secretName" $x.password.secretName "root" .) }}
{{- $passwordKey = $x.password.key }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: sql-exporter-config
  labels:
    {{- include "headhunter.labels" . | nindent 4 }}
    app.kubernetes.io/component: sql-exporter
data:
  sql_exporter.yml: |
    {{- tpl (.Files.Get "files/sql_exporter.yml") . | nindent 4 }}
  mssql_standard.collector.yml: |
    {{- .Files.Get "files/mssql_standard.collector.yml" | nindent 4 }}
  mssql_query_stats.collector.yml: |
    {{- .Files.Get "files/mssql_query_stats.collector.yml" | nindent 4 }}
  {{- range $name, $content := $x.extraCollectorFiles }}
  {{ $name }}: |
    {{- $content | nindent 4 }}
  {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sql-exporter
  labels:
    {{- include "headhunter.labels" . | nindent 4 }}
    app.kubernetes.io/component: sql-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sql-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sql-exporter
        {{- include "headhunter.podLabels" . | nindent 8 }}
        app.kubernetes.io/component: sql-exporter
        {{- with $x.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # Restart on a config change: the exporter reads it only at start.
        checksum/config: {{ list (tpl (.Files.Get "files/sql_exporter.yml") .) (.Files.Get "files/mssql_standard.collector.yml") (.Files.Get "files/mssql_query_stats.collector.yml") $x.extraCollectorFiles | toJson | sha256sum }}
        {{- with $x.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: {{ include "headhunter.image" $x.image }}
          imagePullPolicy: {{ $x.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            # The connection is a URL, so the password is percent-encoded first (a bare ':' or '@'
            # would split it in the wrong place), and handed over through the environment so it never
            # appears in the process arguments. Unreserved characters pass through untouched.
            - |
              enc=$(printf '%s' "$DB_PASSWORD" | awk 'BEGIN{for(i=0;i<256;i++)o[sprintf("%c",i)]=i}
                {n=split($0,a,"");for(i=1;i<=n;i++){c=a[i];
                 if(c~/[A-Za-z0-9._~-]/)printf "%s",c;else printf "%%%02X",o[c]}}')
              export SQLEXPORTER_TARGET_DSN="sqlserver://$DB_USER:$enc@$DB_HOST:$DB_PORT?$DSN_OPTIONS"
              exec /bin/sql_exporter -config.file=/config/sql_exporter.yml -web.listen-address=:{{ $x.port }}
          env:
            # Its cache directory ($HOME/.cache) goes on the writable /tmp.
            - name: HOME
              value: /tmp
            - name: DB_HOST
              value: {{ include "headhunter.dbHost" . | quote }}
            - name: DB_PORT
              value: {{ include "headhunter.dbPort" . | quote }}
            - name: DB_USER
              value: {{ $user | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $passwordSecret }}
                  key: {{ $passwordKey }}
            - name: DSN_OPTIONS
              value: {{ $x.dsnOptions | quote }}
          ports:
            - name: metrics
              containerPort: {{ $x.port }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 10
          {{- with $x.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /config
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: sql-exporter-config
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
      {{- with $x.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: sql-exporter
  labels:
    {{- include "headhunter.labels" . | nindent 4 }}
    app.kubernetes.io/component: sql-exporter
spec:
  selector:
    app.kubernetes.io/name: sql-exporter
  ports:
    - name: metrics
      port: {{ $x.port }}
      targetPort: metrics
{{- with $x.serviceMonitor }}
{{- if .enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: sql-exporter
  labels:
    {{- include "headhunter.labels" $ | nindent 4 }}
    app.kubernetes.io/component: sql-exporter
    {{- with .labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: sql-exporter
  endpoints:
    - port: metrics
      interval: {{ .interval }}
      {{- with .relabelings }}
      relabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
{{- end }}
