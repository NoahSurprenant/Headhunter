suite: migrations
templates:
  - templates/migrations.yaml
release:
  namespace: hh
set:
  mssql.acceptEula: true
tests:
  - it: runs after SQL Server and before the app, without retries
    asserts:
      - isKind: { of: Job }
      - matchRegex: { path: metadata.name, pattern: "^headhunter-migrate-[0-9a-f]{10}$" }
      - equal: { path: "metadata.annotations['argocd.argoproj.io/sync-wave']", value: "-1" }
      - equal: { path: spec.backoffLimit, value: 0 }
      - equal: { path: spec.template.metadata.labels.app, value: headhunter-migrate }

  - it: waits, checks, backs up, then migrates
    asserts:
      - equal: { path: "spec.template.spec.initContainers[0].name", value: wait-for-database }
      - equal: { path: "spec.template.spec.initContainers[1].name", value: check-pending }
      - equal: { path: "spec.template.spec.initContainers[2].name", value: backup }
      - equal: { path: "spec.template.spec.containers[0].name", value: migrate }
      - matchRegex: { path: "spec.template.spec.containers[0].args[0]", pattern: "\\n\\s*/app/efbundle\\n" }
      - matchRegex: { path: "spec.template.spec.initContainers[2].args[0]", pattern: "WITH COPY_ONLY, COMPRESSION, CHECKSUM" }

  # Kubernetes turns $$ into $; the backslash keeps the shell from running $(DB_NAME) as a command.
  - it: passes sqlcmd variables through the shell untouched
    asserts:
      - matchRegex: { path: "spec.template.spec.initContainers[1].args[0]", pattern: 'DB_ID\(N.\\\$\$\(DB_NAME\)' }
      - notMatchRegex: { path: "spec.template.spec.initContainers[1].args[0]", pattern: '[^\\]\$\$\(DB_NAME\)' }

  - it: skips the backup step when told
    set:
      migrations.backup.enabled: false
    asserts:
      - lengthEqual: { path: spec.template.spec.initContainers, count: 2 }

  - it: connects the bundle as the administrator, whatever the app uses
    set:
      database.connectionString.key: ConnectionString
      database.password.key: Password
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ConnectionStrings__Headhunter
            value: Server=mssql,1433;Database=Headhunter;User Id=sa;Password="$(DB_PASSWORD)";Encrypt=True;TrustServerCertificate=True;Command Timeout=3600
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: headhunter-secrets, key: Password } } }


  - it: is off with migrations.enabled false
    set:
      migrations.enabled: false
    asserts:
      - hasDocuments: { count: 0 }

  - it: has no configure step without server settings
    asserts:
      - notContains: { path: spec.template.spec.initContainers, content: { name: configure }, any: true }

  - it: applies server settings before checking migrations, only those that differ
    set:
      mssql.configuration: { max degree of parallelism: 2, cost threshold for parallelism: 50 }
    asserts:
      - equal: { path: "spec.template.spec.initContainers[1].name", value: configure }
      - equal: { path: "spec.template.spec.initContainers[2].name", value: check-pending }
      - matchRegex:
          path: "spec.template.spec.initContainers[1].args[0]"
          pattern: "WHERE name = N'max degree of parallelism'\\);\\s+IF @current IS NULL THROW[^\\n]*\\n\\s+IF @current <> 2\\s+BEGIN"
      - matchRegex:
          path: "spec.template.spec.initContainers[1].args[0]"
          pattern: "EXEC sp_configure N'cost threshold for parallelism', 50;"
      - matchRegex: { path: "spec.template.spec.initContainers[1].args[0]", pattern: "RECONFIGURE;\"\\s*$" }

  - it: refuses a server setting that isn't a number
    set:
      mssql.configuration: { max degree of parallelism: two }
    asserts:
      - failedTemplate: { errorMessage: "mssql.configuration: max degree of parallelism must be a number" }

  - it: leaves the recovery model alone by default
    asserts:
      - notMatchRegex: { path: "spec.template.spec.containers[0].args[0]", pattern: "SET RECOVERY" }

  - it: sets the recovery model after the migrations, only if it differs
    set:
      database.recoveryModel: SIMPLE
    asserts:
      - matchRegex: { path: "spec.template.spec.containers[0].args[0]", pattern: "/app/efbundle[\\s\\S]*IF @current <> N'SIMPLE'[\\s\\S]*SET RECOVERY SIMPLE" }
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: SQLCMDPASSWORD, valueFrom: { secretKeyRef: { name: headhunter-secrets, key: SA_PASSWORD } } }

  - it: refuses an unknown recovery model
    set:
      database.recoveryModel: simple
    asserts:
      - failedTemplate: { errorMessage: "database.recoveryModel must be SIMPLE, FULL or BULK_LOGGED" }

  # $(DB_NAME) without $$ would be expanded by Kubernetes itself (DB_NAME is in the env).
  - it: escapes sqlcmd variables in the migrate step too
    set:
      database.recoveryModel: SIMPLE
    asserts:
      - notMatchRegex: { path: "spec.template.spec.containers[0].args[0]", pattern: '[^$]\$\(DB_NAME\)' }
