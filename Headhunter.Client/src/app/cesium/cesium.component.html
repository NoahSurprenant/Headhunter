<div id="cesiumContainer" [class.drawing]="drawing()">
</div>
<!-- The globe's top-left toolbar: one row of controls, all styled alike, then the colour legend and whatever the page
     puts under them (the voters page's hint), stacked so nothing overlaps. It stops short of Cesium's own
     toolbar (top right) and the row wraps when it has to; on a phone "Colour by" is just the select. -->
<div class="globe-toolbar absolute top-3 left-3 right-44 z-10 flex flex-col items-start gap-2 pointer-events-none">
    <div class="flex flex-wrap items-center gap-2 pointer-events-auto">
        <button type="button" (click)="copyLink()"
            class="flex items-center gap-1.5 px-3 py-1.5 rounded border border-white/30 bg-black/60 hover:bg-black/80 text-white text-sm font-medium cursor-pointer">
            Copy link
        </button>
        @if (selectable()) {
            <button type="button" (click)="toggleDrawing()" [attr.aria-pressed]="drawing()"
                [class]="drawing() ? 'bg-yellow-300 text-gray-900 border-yellow-400' : 'bg-black/60 text-white border-white/30 hover:bg-black/80'"
                class="area-toggle flex items-center gap-1.5 px-3 py-1.5 rounded border text-sm font-medium cursor-pointer">
                <svg class="w-4 h-4" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 2" aria-hidden="true">
                    <rect x="2" y="3" width="12" height="10" rx="1"/>
                </svg>
                {{ drawing() ? 'Drag on the globe…' : 'Select area' }}
            </button>
        }
        <!-- Cluster colouring: the metric picker. -->
        <label class="colour-by flex items-center gap-1.5 max-w-full px-3 py-1.5 rounded border border-white/30 bg-black/60 hover:bg-black/80 text-white text-sm font-medium">
            <span class="hidden sm:inline shrink-0">Colour by</span>
            <select class="bg-transparent text-white outline-none cursor-pointer min-w-0 max-w-28 sm:max-w-56" aria-label="Colour clusters by"
                [value]="metric()" (change)="setMetric($any($event.target).value)">
                @for (option of metricOptions; track option.metric) {
                    <option class="text-black" [value]="option.metric">{{ option.label }}</option>
                }
            </select>
        </label>
        @if (copied()) {
            <span class="bg-black/80 text-white text-xs px-2 py-1 rounded animate-fade-in pointer-events-none">Copied</span>
        }
    </div>
    <!-- The view's range of the metric. -->
    @if (legend(); as l) {
        <div class="bg-black/60 text-white text-xs rounded px-2 py-1.5 shadow w-48 max-w-full" data-testid="legend">
            <div class="mb-1">{{ l.label }}</div>
            <div class="h-2 rounded-sm" [style.background]="scaleGradient"></div>
            <div class="flex justify-between mt-0.5"><span>{{ l.min }}</span><span>{{ l.max }}</span></div>
        </div>
    }
    <ng-content />
</div>
@if (hovered(); as h) {
    <div class="absolute pointer-events-none bg-black/75 text-white text-xs rounded px-2 py-1 whitespace-nowrap"
        role="tooltip" [style.left.px]="h.x + 14" [style.top.px]="h.y + 14">{{ h.text }}</div>
}
@if (selectedEntity(); as entity) {
    <app-custom-info-box
    #customInfoBox
    [entity]="entity"
    [viewer]="viewer"
    (closeInfoBox)="closeInfoBox()"
    >
    </app-custom-info-box>
}
